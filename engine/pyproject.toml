[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splat360"
version = "1.0.0"
description = "Splat360 Studio engine: turn Insta360 360° video into 3D Gaussian splats"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pupil-apriltags>=1.0.4",
    "reportlab>=4.0",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "psutil>=5.9",
    "typer>=0.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
splat360 = "splat360.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["splat360*"]

[tool.setuptools.package-data]
splat360 = ["data/*.json", "templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF100"]
ignore = ["E501", "B008", "SIM108", "SIM102", "SIM105", "UP007", "UP035", "UP006", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["splat360"]
