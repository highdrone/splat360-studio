<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Splat360 Studio – Setup</title>
  <style>
    :root { color-scheme: light dark; --fg: #e6e6e6; --bg: #17181b; --muted: #9a9ca3; --accent: #4fd1c5; --err: #ff6b6b; }
    @media (prefers-color-scheme: light) { :root { --fg: #1b1b1f; --bg: #f5f5f7; --muted: #5c5f66; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    body { display: flex; flex-direction: column; padding: 18px 20px 16px; box-sizing: border-box; -webkit-app-region: drag; }
    h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
    p { margin: 0 0 10px; color: var(--muted); }
    #message { white-space: pre-wrap; color: var(--fg); }
    #message.error { color: var(--err); }
    pre { flex: 1; margin: 8px 0 12px; padding: 10px; overflow: auto; background: rgba(127,127,127,0.12); border-radius: 6px; font: 11px ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; -webkit-app-region: no-drag; }
    .row { display: flex; gap: 8px; justify-content: flex-end; -webkit-app-region: no-drag; }
    button { font: inherit; padding: 5px 14px; border-radius: 6px; border: 1px solid rgba(127,127,127,0.4); background: transparent; color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #062b28; font-weight: 600; }
    button[hidden] { display: none; }
    .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1 id="title"><span class="spinner" id="spin"></span>Setting up the Splat360 engine</h1>
  <p id="message">Creating a Python environment and installing the engine. This runs once and takes a minute or two.</p>
  <pre id="log"></pre>
  <div class="row">
    <button id="brew" hidden>Homebrew instructions</button>
    <button id="copy">Copy log</button>
    <button id="retry" hidden>Retry</button>
    <button id="quit">Quit</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = $("log");
    let lines = [];
    window.shell.onLine((line) => {
      lines.push(line);
      if (lines.length > 2000) lines = lines.slice(-1500);
      log.textContent = lines.join("\n");
      log.scrollTop = log.scrollHeight;
    });
    window.shell.onState((s) => {
      $("spin").style.display = (s.phase === "done" || s.phase === "error") ? "none" : "inline-block";
      if (s.title) $("title").lastChild.textContent = s.title;
      const m = $("message");
      m.textContent = s.message || "";
      m.classList.toggle("error", s.phase === "error");
      $("retry").hidden = !(s.phase === "error" && s.canRetry);
      $("brew").hidden = !(s.phase === "error" && /Homebrew/.test(s.message || ""));
      if (s.logTail) { lines = s.logTail.split("\n"); log.textContent = s.logTail; log.scrollTop = log.scrollHeight; }
    });
    $("copy").onclick = async () => {
      const ok = await window.shell.copyLog();
      $("copy").textContent = ok ? "Copied" : "Copy failed";
      setTimeout(() => ($("copy").textContent = "Copy log"), 1500);
    };
    $("retry").onclick = () => window.shell.retry();
    $("quit").onclick = () => window.shell.quit();
    $("brew").onclick = () => window.shell.openExternal("https://brew.sh/");
  </script>
</body>
</html>
